name: Capture real app screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-app-screenshots.yml"
      - "scripts/capture-app-screenshots.mjs"
      - "scripts/prepare-botanica-demo.mjs"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: portfolio
          persist-credentials: true

      - name: Checkout Everyday (public source)
        uses: actions/checkout@v4
        with:
          repository: DownAirOnly/fitness-tracker
          ref: main
          path: everyday
          persist-credentials: false

      - name: Checkout Botanica (public source)
        uses: actions/checkout@v4
        with:
          repository: DownAirOnly/botanica
          ref: main
          path: botanica
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and app dependencies
        run: |
          cd portfolio
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          cd ../botanica
          npm install --no-package-lock

      - name: Prepare temporary, isolated Botanica demo
        run: node portfolio/scripts/prepare-botanica-demo.mjs botanica

      - name: Start both real apps locally
        run: |
          python3 -m http.server 4191 --directory everyday > /tmp/everyday-server.log 2>&1 &
          (cd botanica && npm run dev -- --host 127.0.0.1 --port 4192 > /tmp/botanica-server.log 2>&1) &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4191/ >/dev/null && curl -fsS http://127.0.0.1:4192/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/everyday-server.log /tmp/botanica-server.log
          exit 1

      - name: Render actual app screens using fictional data
        run: node portfolio/scripts/capture-app-screenshots.mjs portfolio/assets/screenshots

      - name: Update portfolio image paths and captions
        run: node portfolio/scripts/update-portfolio-captures.mjs portfolio

      - name: Commit screenshots to portfolio
        run: |
          cd portfolio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/ index.html script.js README.md
          if git diff --staged --quiet; then
            echo "Screenshots already current."
          else
            git commit -m "Add real app screenshots captured with sample data"
            git push origin HEAD:main
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: portfolio/assets/screenshots/
          if-no-files-found: ignore
